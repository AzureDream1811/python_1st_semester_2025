{% extends 'base.html' %}

{% block title %}404 — Trang không tìm thấy{% endblock %}

{% block content %}
    <div class="d-flex align-items-center justify-content-center" style="min-height:60vh">
        <div class="text-center">
            <i class="bi bi-search display-1 text-muted"></i>
            <h1 class="display-4 mt-3">404 — Trang không tìm thấy</h1>
            <p class="lead text-muted">Xin lỗi, chúng tôi không tìm thấy trang bạn đang tìm kiếm.</p>

            <form action="{% url 'products:search' %}" method="get" class="d-flex justify-content-center mt-3">
                <input name="q" class="form-control" style="max-width:520px;" placeholder="Tìm kiếm sản phẩm..." value="{{ request.GET.q }}">
                <button class="btn btn-primary ms-2">Tìm</button>
            </form>

            <a href="{% url 'products:home' %}" class="btn btn-outline-primary mt-4">Quay về trang chủ</a>
        </div>
    </div>
{% endblock %}
