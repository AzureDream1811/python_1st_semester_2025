{% extends 'base.html' %}

{% block extra_css %}
    <link href="{% static 'css/errors.css' %}" rel="stylesheet">
{% endblock %}

{% block title %}404 — Trang không tìm thấy{% endblock %}

{% block content %}
    <div class="error-page-wrapper">
        <div class="error-card">
            <i class="bi bi-search error-icon text-muted"></i>
            <h1 class="error-title">404 — Trang không tìm thấy</h1>
            <p class="error-lead">Xin lỗi, chúng tôi không tìm thấy trang bạn đang tìm kiếm.</p>

            <form action="{% url 'products:search' %}" method="get" class="error-search">
                <input name="q" class="form-control" placeholder="Tìm kiếm sản phẩm..." value="{{ request.GET.q }}">
                <button class="btn btn-primary">Tìm</button>
            </form>

            <a href="{% url 'products:home' %}" class="btn btn-outline-primary mt-4">Quay về trang chủ</a>
        </div>
    </div>
{% endblock %}
