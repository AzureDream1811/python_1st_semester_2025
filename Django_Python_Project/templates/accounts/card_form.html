{% extends 'base.html' %}

{% block title %}Thêm thẻ thanh toán - ElectroShop{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0">
                        <i class="bi bi-credit-card me-2 text-primary"></i>Thêm thẻ thanh toán
                    </h5>
                </div>
                <div class="card-body">
                    <form id="cardForm" method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Số thẻ <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input autocomplete="cc-number" class="form-control" id="cardNumber" maxlength="19"
                                       name="card_number" placeholder="1234 5678 9012 3456" required
                                       type="text">
                                <span class="input-group-text" id="cardTypeIcon">
                                    <i class="bi bi-credit-card"></i>
                                </span>
                            </div>
                            <div class="form-text" id="cardNumberFeedback"></div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label">Ngày hết hạn <span class="text-danger">*</span></label>
                                <div class="row g-2">
                                    <div class="col-6">
                                        <select class="form-select" id="expiryMonth" name="expiry_month" required>
                                            <option value="">MM</option>
                                            {% for m in "01,02,03,04,05,06,07,08,09,10,11,12"|make_list %}
                                            {% endfor %}
                                            <option value="1">01</option>
                                            <option value="2">02</option>
                                            <option value="3">03</option>
                                            <option value="4">04</option>
                                            <option value="5">05</option>
                                            <option value="6">06</option>
                                            <option value="7">07</option>
                                            <option value="8">08</option>
                                            <option value="9">09</option>
                                            <option value="10">10</option>
                                            <option value="11">11</option>
                                            <option value="12">12</option>
                                        </select>
                                    </div>
                                    <div class="col-6">
                                        <select class="form-select" id="expiryYear" name="expiry_year" required>
                                            <option value="">YY</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="form-label">CVV <span class="text-danger">*</span></label>
                                <input autocomplete="cc-csc" class="form-control" id="cvv" maxlength="3"
                                       name="cvv" placeholder="123" required
                                       type="text">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tên chủ thẻ <span class="text-danger">*</span></label>
                            <input autocomplete="cc-name" class="form-control" id="cardholderName" name="cardholder_name"
                                   placeholder="NGUYEN VAN A" required style="text-transform: uppercase;"
                                   type="text">
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" id="isDefault" name="is_default" type="checkbox">
                                <label class="form-check-label" for="isDefault">
                                    Đặt làm thẻ mặc định
                                </label>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-primary" id="submitBtn" type="submit">
                                <i class="bi bi-check-lg me-1"></i>Thêm thẻ
                            </button>
                            <a class="btn btn-outline-secondary" href="{% url 'accounts:card_list' %}">
                                Hủy
                            </a>
                        </div>
                    </form>

                    <div class="mt-4">
                        <p class="text-muted small mb-2">Chúng tôi chấp nhận:</p>
                        <div class="d-flex gap-2">
                            <img alt="Visa" height="30" src="https://img.icons8.com/color/48/visa.png">
                            <img alt="Mastercard" height="30" src="https://img.icons8.com/color/48/mastercard.png">
                            <img alt="JCB" height="30" src="https://img.icons8.com/color/48/jcb.png">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const cardNumber = document.getElementById('cardNumber');
        const cardTypeIcon = document.getElementById('cardTypeIcon');
        const cardNumberFeedback = document.getElementById('cardNumberFeedback');
        const expiryYear = document.getElementById('expiryYear');
        const cvv = document.getElementById('cvv');
        const cardholderName = document.getElementById('cardholderName');

        // Populate year options
        const currentYear = new Date().getFullYear();
        for (let i = 0; i < 15; i++) {
            const year = currentYear + i;
            const option = document.createElement('option');
            option.value = year;
            option.textContent = year.toString().slice(-2);
            expiryYear.appendChild(option);
        }

        // Format card number with spaces
        cardNumber.addEventListener('input', function (e) {
            let value = e.target.value.replace(/\s/g, '').replace(/\D/g, '');
            let formatted = '';
            for (let i = 0; i < value.length; i++) {
                if (i > 0 && i % 4 === 0) formatted += ' ';
                formatted += value[i];
            }
            e.target.value = formatted;

            // Detect card type
            detectCardType(value);
        });

        // Detect card type and validate
        function detectCardType(number) {
            let cardType = null;
            let icon = '<i class="bi bi-credit-card"></i>';

            if (number.startsWith('4')) {
                cardType = 'visa';
                icon = '<img src="https://img.icons8.com/color/24/visa.png" alt="Visa">';
            } else if (/^5[1-5]/.test(number) || /^2[2-7]/.test(number)) {
                cardType = 'mastercard';
                icon = '<img src="https://img.icons8.com/color/24/mastercard.png" alt="Mastercard">';
            } else if (/^35(2[89]|[3-8])/.test(number)) {
                cardType = 'jcb';
                icon = '<img src="https://img.icons8.com/color/24/jcb.png" alt="JCB">';
            }

            cardTypeIcon.innerHTML = icon;

            // Validate with Luhn if long enough
            if (number.length >= 13) {
                const isValid = luhnCheck(number);
                if (isValid) {
                    cardNumberFeedback.innerHTML = '<span class="text-success"><i class="bi bi-check-circle"></i> Số thẻ hợp lệ</span>';
                    cardNumber.classList.remove('is-invalid');
                    cardNumber.classList.add('is-valid');
                } else {
                    cardNumberFeedback.innerHTML = '<span class="text-danger"><i class="bi bi-x-circle"></i> Số thẻ không hợp lệ</span>';
                    cardNumber.classList.remove('is-valid');
                    cardNumber.classList.add('is-invalid');
                }
            } else {
                cardNumberFeedback.innerHTML = '';
                cardNumber.classList.remove('is-valid', 'is-invalid');
            }
        }

        // Luhn algorithm
        function luhnCheck(num) {
            let arr = (num + '').split('').reverse().map(x => parseInt(x));
            let sum = arr.reduce((acc, val, i) => {
                if (i % 2 !== 0) {
                    val *= 2;
                    if (val > 9) val -= 9;
                }
                return acc + val;
            }, 0);
            return sum % 10 === 0;
        }

        // CVV only numbers
        cvv.addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        // Uppercase cardholder name
        cardholderName.addEventListener('input', function (e) {
            e.target.value = e.target.value.toUpperCase();
        });
    });
</script>
{% endblock %}
