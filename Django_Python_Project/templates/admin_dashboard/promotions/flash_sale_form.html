{% extends 'admin_dashboard/base.html' %}

{% block title %}Thêm Flash Sale{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-lightning"></i> Thêm Flash Sale</h2>
    <a class="btn btn-outline-secondary" href="{% url 'admin_dashboard:flash_sale_list' %}">
        <i class="bi bi-arrow-left"></i> Quay lại
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Sản phẩm *</label>
                {{ form.product }}
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Giá Flash Sale *</label>
                    {{ form.sale_price }}
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Số lượng giới hạn *</label>
                    {{ form.quantity_limit }}
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Bắt đầu *</label>
                    {{ form.start_time }}
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Kết thúc *</label>
                    {{ form.end_time }}
                </div>
            </div>
            <div class="form-check mb-3">
                {{ form.is_active }}
                <label class="form-check-label">Kích hoạt</label>
            </div>
            <button class="btn btn-primary" type="submit">
                <i class="bi bi-check-lg"></i> Tạo Flash Sale
            </button>
        </form>
    </div>
</div>
{% endblock %}
