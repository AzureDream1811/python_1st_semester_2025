{% extends 'base.html' %}

{% block extra_css %}
    <link href="{% static 'css/errors.css' %}" rel="stylesheet">
{% endblock %}

{% block title %}500 — Lỗi máy chủ{% endblock %}

{% block content %}
    <div class="error-page-wrapper">
        <div class="error-card">
            <i class="bi bi-bug-fill error-icon text-danger"></i>
            <h1 class="error-title">500 — Lỗi máy chủ</h1>
            <p class="error-lead">Có lỗi xảy ra trên máy chủ. Chúng tôi đã được thông báo và đang khắc phục.</p>

            <div class="error-actions">
                <a href="{% url 'products:home' %}" class="btn btn-primary me-2">Quay về trang chủ</a>
                <a href="javascript:location.reload()" class="btn btn-outline-secondary">Thử tải lại</a>
            </div>
        </div>
    </div>
{% endblock %}
